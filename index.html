<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Heart - Thiệp Đôi Mở 2 Mặt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #080305;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        /* --- MÀN HÌNH GÕ CHỮ MỞ ĐẦU --- */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 3, 5, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .typewriter-box {
            text-align: center;
            padding: 0 20px;
            max-width: 600px;
        }

        .typewriter-text {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-style: italic;
            color: #ffd1dc;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            line-height: 1.6;
        }

        /* --- GIAO DIỆN CHÍNH --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .glow-pool {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 140px;
            background: radial-gradient(ellipse at center, rgba(255, 75, 110, 0.5) 0%, rgba(225, 29, 72, 0.2) 50%, rgba(0, 0, 0, 0) 80%);
            pointer-events: none;
            filter: blur(30px);
            z-index: 5;
            transition: opacity 0.5s ease;
        }
        body.broken .glow-pool { opacity: 0; }

        /* Vòng xoay lời chúc đặt cách xa tim, không bị đè */
        .orbit-container {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 110px;
            perspective: 600px;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.5s ease;
        }
        body.broken .orbit-container { opacity: 0; }

        .orbit-ring {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotateOrbit 38s linear infinite;
        }

        .orbit-item {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            white-space: nowrap;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ffd1dc;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8), 0 0 3px rgba(255, 255, 255, 0.7);
        }
        .orbit-item img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ff758c;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.8);
        }

        @keyframes rotateOrbit {
            from { transform: rotateX(20deg) rotateY(0deg); }
            to { transform: rotateX(20deg) rotateY(360deg); }
        }

        /* Phong thư sát đáy màn hình */
        .envelope-section {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            width: 160px;
            height: 110px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        body.broken .envelope-section { pointer-events: none; }

        .envelope-body {
            position: absolute;
            bottom: 0;
            width: 120px;
            height: 75px;
            background: #e11d48;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 0 20px rgba(255, 75, 110, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .envelope-body span {
            color: white;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            margin-top: 22px;
        }

        .envelope-flap {
            position: absolute;
            bottom: 75px;
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 45px solid #fb7185;
            transform-origin: bottom;
            transition: transform 0.8s ease;
            z-index: 4;
        }
        .envelope-section.opening .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .letter-card-inside {
            position: absolute;
            bottom: 12px;
            width: 100px;
            height: 60px;
            background: linear-gradient(145deg, #ffffff, #fff0f3);
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2;
            transition: transform 1.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.4s ease;
        }
        .envelope-section.opening .letter-card-inside {
            transform: translateY(-100px) scale(1.05);
            opacity: 0; 
        }

        /* Modal thiệp */
        .letter-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 4, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .letter-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .card-container {
            position: relative;
            width: 700px;
            max-width: 94%;
            background: linear-gradient(145deg, #ffffff, #fff0f3);
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(255, 105, 180, 0.7);
            border: 2px solid rgba(244, 63, 94, 0.4);
            display: flex;
            overflow: hidden;
            transform: scale(0.2);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }
        .letter-modal.active .card-container {
            transform: scale(1);
            opacity: 1;
        }

        .card-side {
            width: 50%;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-side.left-side {
            background: #fff5f7;
            border-right: 2px dashed rgba(244, 63, 94, 0.3);
        }
        .card-side.left-side img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 16px;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.3);
        }

        .card-side.right-side {
            text-align: left;
            align-items: flex-start;
            background: #ffffff;
        }
        .card-side.right-side h3 {
            color: #e11d48;
            font-size: 20px;
            margin-bottom: 12px;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-style: italic;
        }
        .card-side.right-side p {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        .close-btn {
            background: linear-gradient(135deg, #f43f5e, #be123c);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(225, 29, 72, 0.6);
        }

        @media (max-width: 640px) {
            .typewriter-text { font-size: 20px; }
            .orbit-container { bottom: 100px; width: 280px; }
            .card-container {
                flex-direction: column;
                width: 320px;
            }
            .card-side {
                width: 100%;
                padding: 20px;
            }
            .card-side.left-side {
                border-right: none;
                border-bottom: 2px dashed rgba(244, 63, 94, 0.3);
            }
            .card-side.left-side img {
                height: 170px;
            }
            .card-side.right-side {
                text-align: center;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- HIỆU ỨNG GÕ CHỮ MỞ ĐẦU -->
    <div class="intro-overlay" id="introOverlay">
        <div class="typewriter-box">
            <div class="typewriter-text" id="typewriterText"></div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div class="glow-pool"></div>
    <canvas id="heartCanvas"></canvas>

    <div class="orbit-container" id="orbitContainer">
        <div class="orbit-ring" id="orbitRing"></div>
    </div>

    <!-- Phong thư -->
    <div class="envelope-section" id="envelopeBtn">
        <div class="letter-card-inside"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-body">
            <span>Mở Thư ❤️</span>
        </div>
    </div>

    <!-- Tấm thiệp đôi mở 2 mặt -->
    <div class="letter-modal" id="letterModal">
        <div class="card-container">
            <div class="card-side left-side">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="My Love">
            </div>
            <div class="card-side right-side">
                <h3>Gửi đến em, mảnh ghép tuyệt vời! ✨</h3>
                <p>Cảm ơn cuộc đời đã đưa em đến bên anh. Chúc em luôn rạng rỡ, xinh đẹp và mãi ngập tràn hạnh phúc trong vòng tay anh nhé! 💕</p>
                <button class="close-btn" id="closeBtn">Đóng thiệp</button>
            </div>
        </div>
    </div>

    <script>
        // --- HIỆU ỨNG GÕ CHỮ ---
        const sentences = [
            "Chào cậu...",
            "Hôm nay tự nhiên tớ lại nhớ cậu...",
            "Nên là tớ làm cái này cho cậu xem nè ❤️"
        ];

        const typewriterTextElem = document.getElementById('typewriterText');
        const introOverlay = document.getElementById('introOverlay');

        let sentenceIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeWriter() {
            const currentSentence = sentences[sentenceIndex];

            if (!isDeleting) {
                typewriterTextElem.innerText = currentSentence.substring(0, charIndex + 1);
                charIndex++;

                if (charIndex === currentSentence.length) {
                    if (sentenceIndex === sentences.length - 1) {
                        setTimeout(() => {
                            introOverlay.classList.add('fade-out');
                        }, 1500);
                        return;
                    }

                    isDeleting = true;
                    setTimeout(typeWriter, 1000);
                    return;
                }
                setTimeout(typeWriter, 70);
            } else {
                typewriterTextElem.innerText = currentSentence.substring(0, charIndex - 1);
                charIndex--;

                if (charIndex === 0) {
                    isDeleting = false;
                    sentenceIndex++;
                }
                setTimeout(typeWriter, 35);
            }
        }

        setTimeout(typeWriter, 400);

        // --- VÒNG XOAY LỜI CHÚC ---
        const orbitRing = document.getElementById('orbitRing');
        const itemsData = [
            { type: 'text', content: '💖 Anh yêu em nhất trên đời!' },
            { type: 'text', content: '✨ Cảm ơn vì đã luôn bên anh' },
            { type: 'image', url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100' },
            { type: 'text', content: '🌸 Nụ cười của em là ánh sáng' },
            { type: 'text', content: '💕 Mãi mãi yêu thương em' },
            { type: 'image', url: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100' },
            { type: 'text', content: '🌟 Em là định mệnh của đời anh' },
            { type: 'text', content: '💌 Hạnh phúc khi có em kề bên' },
            { type: 'image', url: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100' },
            { type: 'text', content: '🌹 Chúc tình yêu chúng mình mãi đẹp' },
            { type: 'text', content: '💓 Thế giới của anh chỉ có em' }
        ];

        const totalItems = itemsData.length;
        itemsData.forEach((item, index) => {
            const angle = (index / totalItems) * 360;
            const div = document.createElement('div');
            div.className = 'orbit-item';
            div.style.transform = `rotateY(${angle}deg) translateZ(150px) rotateY(-${angle}deg)`;

            if (item.type === 'text') {
                div.innerHTML = item.content;
            } else {
                div.innerHTML = `<img src="${item.url}" alt="photo">`;
            }
            orbitRing.appendChild(div);
        });

        // --- HIỆU ỨNG TRÁI TIM 3D ---
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        function generateHeartPoints(count, scale) {
            const points = [];
            let attempts = 0;
            while (points.length < count && attempts < count * 12) {
                attempts++;
                const t = Math.random() * Math.PI * 2;
                const r = Math.pow(Math.random(), 0.5); 
                const hx = 16 * Math.pow(Math.sin(t), 3) * r;
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r;
                points.push({ x: hx * scale, y: hy * scale });
            }
            return points;
        }

        let isBroken = false;

        class Particle {
            constructor(targetX, targetY) {
                this.targetX = targetX;
                this.targetY = targetY;
                this.x = window.innerWidth / 2 + (Math.random() - 0.5) * 450;
                this.y = window.innerHeight / 2 + (Math.random() - 0.5) * 450;
                const colors = ['#ff3366', '#ff4d88', '#ff66b2', '#ff99cc', '#ffffff', '#ff1a75'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 2.8 + 0.8;
                this.alpha = Math.random();
                this.maxAlpha = Math.random() * 0.9 + 0.3;
                this.offset = Math.random() * 100;
                this.vx = (Math.random() - 0.5) * 28;
                this.vy = (Math.random() - 0.5) * 28 - 6;
            }

            update() {
                if (isBroken) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.35;
                    this.alpha -= 0.012;
                } else {
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    this.x += dx * 0.08;
                    this.y += dy * 0.08;
                    const time = Date.now() * 0.003 + this.offset;
                    this.x += Math.sin(time) * 0.4;
                    this.y += Math.cos(time) * 0.4;
                    if (this.alpha < this.maxAlpha) this.alpha += 0.04;
                }
            }

            draw() {
                if (this.alpha <= 0.02) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const particleCount = 1600;
        // Đẩy tâm tim nhích lên một chút để nhường không gian phía dưới cho vòng chữ
        const scaleFactor = Math.min(window.innerWidth, window.innerHeight) / 38;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2 - 65;
        const rawPoints = generateHeartPoints(particleCount, scaleFactor);
        const particles = rawPoints.map(pt => new Particle(centerX + pt.x, centerY + pt.y));

        function animate() {
            ctx.fillStyle = 'rgba(8, 3, 5, 0.22)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- XỬ LÝ MỞ THƯ ---
        const envelopeBtn = document.getElementById('envelopeBtn');
        const letterModal = document.getElementById('letterModal');
        const closeBtn = document.getElementById('closeBtn');

        envelopeBtn.addEventListener('click', () => {
            envelopeBtn.classList.add('opening');
            document.body.classList.add('broken');

            setTimeout(() => {
                isBroken = true;
                letterModal.classList.add('active');
            }, 1100); 
        });

        closeBtn.addEventListener('click', () => {
            letterModal.classList.remove('active');
            setTimeout(() => {
                window.location.reload(); 
            }, 400);
        });
    </script>
</body>
</html>
